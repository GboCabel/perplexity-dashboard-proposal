<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>Usage Dashboard — Perplexity Feature Proposal</title>
    <meta name="description"
      content="A high-fidelity interactive prototype proposing a Usage Dashboard for Perplexity Pro users — real-time counters, history, plan comparison, and dark/light themes." />
    <meta name="author" content="Gabriel Cabello Arteaga" />
    <meta name="keywords" content="Perplexity, usage dashboard, feature proposal, prototype, product design" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Usage Dashboard — Perplexity Feature Proposal" />
    <meta property="og:description" content="High-fidelity prototype of a missing Perplexity feature: per-resource usage counters, 7-week history, plan comparison, and real-time simulation." />
    <meta property="og:image"       content="/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="Perplexity Usage Dashboard prototype screenshot" />
    <meta property="og:url"         content="https://perplexity-dashboard-proposal.vercel.app" />
    <meta property="og:site_name"   content="Perplexity Usage Dashboard" />
    <meta property="og:locale"      content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Usage Dashboard — Perplexity Feature Proposal" />
    <meta name="twitter:description" content="High-fidelity prototype of a missing Perplexity feature: per-resource usage counters, 7-week history, plan comparison, and real-time simulation." />
    <meta name="twitter:image"       content="/og-image.png" />
    <meta name="twitter:image:alt"   content="Perplexity Usage Dashboard prototype screenshot" />

    <!-- Theme color (matches Perplexity dark bg) -->
    <meta name="theme-color" content="#0C0C0C" />

    <!-- Preconnect to Google Fonts (already imported in index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
